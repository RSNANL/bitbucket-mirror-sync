name: Mirror aquarium nutrient doser

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: aquarium-nutrient-doser-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Sync branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout mirror infrastructure
        uses: actions/checkout@v6

      - name: Mirror aquarium nutrient doser
        env:
          BBT_MIRROR_SSH_KEY: ${{ secrets.BBT_DOSER_MIRROR_SSH_KEY }}
          GHB_MIRROR_SSH_KEY: ${{ secrets.GHB_DOSER_MIRROR_SSH_KEY }}
        run: |
          scripts/mirror.sh \
            --mirror-id aquarium-nutrient-doser \
            --source-repository rsna_nl/aquarium-nutrient-doser \
            --target-repository RSNANL/aquarium-nutrient-doser-mirror
